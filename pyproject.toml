[project]
name = "paris2024-training-camps"
version = "0.1.0"
description = "Scraper, cleaned dataset and interactive map explorer for the ~1,000 Paris 2024 Olympic & Paralympic training camps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Amine Ben Afia" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
]

[project.optional-dependencies]
app = ["streamlit>=1.38", "pydeck>=0.9", "altair>=5.3"]

[project.scripts]
camps-scrape = "camps.scrape:main"
camps-build = "camps.build:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
